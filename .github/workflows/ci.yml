name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opke-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: opke-rs

      - name: Check code formatting (rustfmt)
        run: cargo fmt --check

      - name: Run clippy (deny all warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: opke-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: opke-rs

      - name: Run test suite (unit, integration & property tests)
        run: cargo test --workspace --all-targets

  miri:
    name: Memory Safety & Undefined Behavior (Miri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opke-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nightly Rust for Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: opke-rs

      - name: Test core crypto and envelope with Miri
        run: cargo miri test --test crypto_tests
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-permissive-provenance"

  audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opke-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit prebuilt binary
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit
