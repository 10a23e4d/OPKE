name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opke-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: opke-rs

      - name: Enforce no prebuilt binaries in repository (Rule 4.3)
        working-directory: .
        run: |
          if git ls-files | grep -E '\.(exe|dll|so|dylib|bin)$|^bin/'; then
            echo "[-] Error: Prebuilt binary or executable detected in git tracking. Per GEMINI.md Rule 4.3, binaries must not be committed."
            exit 1
          else
            echo "[+] Binary check passed: No executables or prebuilt binary artifacts tracked in repository."
          fi

      - name: Check code formatting (rustfmt)
        run: cargo fmt --check

      - name: Run clippy (deny all warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: opke-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: opke-rs

      - name: Run clippy (deny all warnings on ${{ matrix.os }})
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run test suite (unit, integration & property tests)
        run: cargo test --workspace --all-targets

  miri:
    name: Memory Safety & Undefined Behavior (Miri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opke-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nightly Rust for Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: opke-rs

      - name: Test core crypto and envelope with Miri
        run: cargo miri test --test crypto_tests
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-permissive-provenance"

  audit:
    name: Security Vulnerability & Supply Chain Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opke-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit, cargo-deny, and cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-machete

      - name: Run cargo audit
        run: cargo audit

      - name: Run cargo deny check
        run: cargo deny check

      - name: Run cargo machete (unused dependencies)
        run: cargo machete

  fuzz-check:
    name: Fuzz Targets Compilation & Smoke Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opke-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-musl
          components: llvm-tools-preview

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: opke-rs

      - name: Build fuzz targets
        run: |
          set +e
          echo "### Cargo Fuzz Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "which cargo-fuzz: $(which cargo-fuzz 2>&1)" >> $GITHUB_STEP_SUMMARY
          echo "cargo-fuzz version: $(cargo-fuzz --version 2>&1)" >> $GITHUB_STEP_SUMMARY
          echo "cargo version: $(cargo --version 2>&1)" >> $GITHUB_STEP_SUMMARY

          LIST_OUT=$(cargo +nightly fuzz list 2>&1)
          LIST_ST=$?
          echo "### cargo fuzz list (Exit $LIST_ST)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$LIST_OUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$LIST_OUT"
          if [ $LIST_ST -ne 0 ]; then exit $LIST_ST; fi

          BUILD_OUT=$(cargo +nightly fuzz build --sanitizer none 2>&1)
          BUILD_ST=$?
          echo "### cargo fuzz build (Exit $BUILD_ST)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$BUILD_OUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$BUILD_OUT"
          if [ $BUILD_ST -ne 0 ]; then exit $BUILD_ST; fi

      - name: Run libFuzzer smoke test (fuzz_envelope & fuzz_cascade)
        run: |
          set +e
          OUT1=$(cargo +nightly fuzz run fuzz_envelope --sanitizer none -- -runs=1000 -max_total_time=5 -max_len=4096 2>&1)
          ST1=$?
          echo "### fuzz_envelope (Exit $ST1)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$OUT1" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$OUT1"

          OUT2=$(cargo +nightly fuzz run fuzz_cascade --sanitizer none -- -runs=1000 -max_total_time=5 -max_len=4096 2>&1)
          ST2=$?
          echo "### fuzz_cascade (Exit $ST2)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$OUT2" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$OUT2"

          if [ $ST1 -ne 0 ] || [ $ST2 -ne 0 ]; then exit 1; fi

  kani:
    name: Formal Verification (Kani)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Kani Model Checker
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: opke-rs
          args: "--tests"
