name: Release
run-name: Build & Publish Release (${{ github.ref_name }})

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: opke.exe
            asset_name: opke-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: opke
            asset_name: opke-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin_name: opke
            asset_name: opke-linux-musl-x86_64
    defaults:
      run:
        working-directory: opke-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux MUSL)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build optimized release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release asset & compute checksum
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} "$GITHUB_WORKSPACE/dist/${{ matrix.asset_name }}"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
