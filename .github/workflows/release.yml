name: Release
run-name: Build & Publish Release (${{ github.ref_name }})

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: opke.exe
            asset_name: opke-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: opke
            asset_name: opke-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin_name: opke
            asset_name: opke-linux-musl-x86_64
    defaults:
      run:
        working-directory: opke-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux MUSL)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Run test suite for target (${{ matrix.target }})
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build optimized release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test release binary & prepare release asset
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          "$BIN_PATH" --version

          SMOKE_DIR="./smoke_test_tmp"
          rm -rf "$SMOKE_DIR" && mkdir -p "$SMOKE_DIR"
          printf "OPKE-Release-Smoke-Test-Payload" > "$SMOKE_DIR/plain.txt"
          OPKE_PASSPHRASE="SmokeTestPassphrase#2026" "$BIN_PATH" encrypt -i "$SMOKE_DIR/plain.txt" -o "$SMOKE_DIR/cipher.pem" --profile fast
          "$BIN_PATH" inspect -i "$SMOKE_DIR/cipher.pem"
          OPKE_PASSPHRASE="SmokeTestPassphrase#2026" "$BIN_PATH" decrypt -i "$SMOKE_DIR/cipher.pem" -o "$SMOKE_DIR/dec.txt"
          cmp -s "$SMOKE_DIR/plain.txt" "$SMOKE_DIR/dec.txt"
          rm -rf "$SMOKE_DIR"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$BIN_PATH" "$GITHUB_WORKSPACE/dist/${{ matrix.asset_name }}"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
