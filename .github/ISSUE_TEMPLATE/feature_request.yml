name: Feature Request
description: Suggest an idea or enhancement for OPKE
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please consider the project's KISS principle and threat model before submitting a feature request.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated.
    validations:
      required: false
